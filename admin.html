<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - AI Chatbox</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/styles/tailwind.css">
    <script src="/vendor/vue.global.prod.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div id="app" class="max-w-4xl mx-auto p-6 sm:p-10">
        <header class="flex items-center justify-between border-b border-gray-700 pb-5 mb-8">
            <div>
                <p class="text-blue-400 text-sm mb-1">AI Chatbox</p>
                <h1 class="text-2xl font-bold">管理后台</h1>
            </div>
            <div class="flex gap-3">
                <button @click="goHome" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition">返回聊天</button>
                <button @click="logout" class="px-4 py-2 rounded-lg text-gray-400 hover:text-red-400 transition">退出登录</button>
            </div>
        </header>

        <div v-if="loading" class="text-gray-400">正在加载...</div>
        <section v-else class="bg-gray-800 border border-gray-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-2">全局系统提示词</h2>
            <p class="text-sm text-gray-400 mb-5">此内容会注入所有用户的新对话上下文。</p>
            <textarea v-model="settings.global_system_prompt" rows="10" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 focus:outline-none focus:border-blue-500 text-gray-200"></textarea>
            <label class="block mt-6">
                <span class="block text-sm text-gray-300 mb-2">外部 API 代理地址</span>
                <input v-model="settings.proxy_url" type="url" placeholder="留空则直连，例如：http://127.0.0.1:7890" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                <span class="block text-xs text-gray-500 mt-2">用于外部 API 请求和获取模型；留空时不使用代理。</span>
            </label>
            <label class="block mt-6">
                <span class="block text-sm text-gray-300 mb-2">注册邀请码</span>
                <input v-model="settings.registration_code" type="password" autocomplete="new-password" maxlength="128" placeholder="留空则开放注册" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                <span class="block text-xs text-gray-500 mt-2">设置后注册必须填写该邀请码；清空并保存后恢复开放注册。</span>
            </label>
            <div class="flex items-center justify-between gap-4 mt-8 mb-2">
                <h2 class="text-lg font-semibold">外部 API</h2>
                <button @click="addProvider" type="button" class="px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 transition">添加 API</button>
            </div>
            <p class="text-sm text-gray-400 mb-5">可配置多个服务商。GPT、DeepSeek、Gemini 等选择 OpenAI 兼容；Claude 选择 Anthropic。</p>
            <div v-for="(provider, index) in settings.providers" :key="provider.id" class="border border-gray-700 rounded-lg p-4 mb-4">
                <div class="flex items-center justify-between gap-3 mb-4">
                    <span class="font-medium">API {{ index + 1 }}</span>
                    <button @click="removeProvider(index)" type="button" class="text-sm text-red-400 hover:text-red-300">删除</button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <label class="block">
                        <span class="block text-sm text-gray-300 mb-2">显示名称</span>
                        <input v-model="provider.name" type="text" placeholder="例如：OpenAI、DeepSeek、Claude" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                    </label>
                    <label class="block">
                        <span class="block text-sm text-gray-300 mb-2">接口类型</span>
                        <select v-model="provider.type" @change="provider.base_url = provider.type === 'anthropic' ? 'https://api.anthropic.com' : ''" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                            <option value="openai">OpenAI 兼容（GPT / DeepSeek / Gemini 等）</option>
                            <option value="anthropic">Anthropic（Claude）</option>
                        </select>
                    </label>
                    <label class="block sm:col-span-2">
                        <span class="block text-sm text-gray-300 mb-2">API 地址</span>
                        <input v-model="provider.base_url" type="url" :placeholder="provider.type === 'anthropic' ? 'https://api.anthropic.com' : 'https://api.openai.com/v1'" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                    </label>
                    <label class="block sm:col-span-2">
                        <span class="block text-sm text-gray-300 mb-2">API Key</span>
                        <input v-model="provider.api_key" type="password" autocomplete="off" placeholder="输入此服务商的 API Key" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                    </label>
                    <label class="block sm:col-span-2">
                        <span class="block text-sm text-gray-300 mb-2">模型列表</span>
                        <span class="block text-xs text-gray-500 mb-2">可点击获取，或手动输入模型 ID，多个模型用逗号或换行分隔。</span>
                        <textarea v-model="provider.models" rows="3" placeholder="gpt-4o, gpt-4.1" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200"></textarea>
                    </label>
                    <div class="sm:col-span-2 flex items-center gap-3">
                        <button @click="fetchModels(provider)" :disabled="provider.loadingModels" type="button" class="px-4 py-2 rounded-lg bg-gray-700 hover:bg-gray-600 disabled:opacity-50 transition">
                            {{ provider.loadingModels ? '获取中...' : '获取模型' }}
                        </button>
                        <span v-if="provider.modelStatus" class="text-sm text-gray-400">{{ provider.modelStatus }}</span>
                    </div>
                </div>
            </div>
            <h2 class="text-lg font-semibold mt-8 mb-2">模型生成参数</h2>
            <p class="text-sm text-gray-400 mb-5">参数会应用到所有用户的 Ollama 对话。</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <label v-for="field in optionFields" :key="field.key" class="block">
                    <span class="block text-sm text-gray-300 mb-2">{{ field.label }}</span>
                    <span class="block text-xs text-gray-500 mb-2">{{ field.help }}</span>
                    <input v-model="settings[field.key]" :step="field.step" :min="field.min" :max="field.max" type="number" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 focus:outline-none focus:border-blue-500 text-gray-200">
                </label>
            </div>
            <div class="flex justify-end mt-5">
                <button @click="saveSettings" :disabled="saving" class="px-5 py-2 rounded-lg bg-blue-600 hover:bg-blue-700 disabled:opacity-50 transition">
                    {{ saving ? '保存中...' : '保存修改' }}
                </button>
            </div>
        </section>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const token = localStorage.getItem('chat_token') || '';
                const role = localStorage.getItem('chat_role') || '';
                const settings = ref({ global_system_prompt: '', providers: [] });
                const optionFields = [
                    { key: 'temperature', label: '温度', help: '越高越有创造性，范围 0 到 2。', step: '0.1', min: '0', max: '2' },
                    { key: 'num_ctx', label: '上下文长度', help: '模型可读取的上下文 token 数。', step: '128', min: '128', max: '131072' },
                    { key: 'top_p', label: 'Top P', help: '控制候选词概率范围，范围 0 到 1。', step: '0.05', min: '0', max: '1' },
                    { key: 'top_k', label: 'Top K', help: '每步保留的候选词数量。', step: '1', min: '0', max: '1000' },
                    { key: 'repeat_penalty', label: '重复惩罚', help: '大于 1 时减少重复内容。', step: '0.05', min: '0', max: '3' },
                    { key: 'seed', label: '随机种子', help: '-1 表示每次随机，固定值可复现结果。', step: '1', min: '-1', max: '2147483647' },
                    { key: 'num_predict', label: '最大生成长度', help: '-1 表示不限制生成 token 数。', step: '1', min: '-1', max: '131072' }
                ];
                const loading = ref(true);
                const saving = ref(false);

                const logout = () => {
                    localStorage.removeItem('chat_token');
                    localStorage.removeItem('chat_role');
                    window.location.href = '/';
                };

                const goHome = () => { window.location.href = '/'; };

                const createProvider = (provider = {}) => ({
                    id: provider.id || (crypto.randomUUID ? crypto.randomUUID() : `provider-${Date.now()}-${Math.random().toString(16).slice(2)}`),
                    name: provider.name || '',
                    type: provider.type || 'openai',
                    base_url: provider.base_url || '',
                    api_key: provider.api_key || '',
                    models: provider.models || '',
                    loadingModels: false,
                    modelStatus: ''
                });

                const addProvider = () => settings.value.providers.push(createProvider());
                const removeProvider = (index) => settings.value.providers.splice(index, 1);

                const fetchModels = async (provider) => {
                    provider.loadingModels = true;
                    provider.modelStatus = '';
                    try {
                        const res = await fetch('/api/admin/models', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
                            body: JSON.stringify({ ...provider, proxy_url: settings.value.proxy_url })
                        });
                        const responseText = await res.text();
                        let data;
                        try {
                            data = JSON.parse(responseText);
                        } catch (error) {
                            throw new Error('服务端没有返回 JSON，可能尚未重启到最新版本；请重启 aichatbox 服务后重试。');
                        }
                        if (!res.ok) throw new Error(data.detail || '获取失败');
                        provider.models = [...new Set(data.models || [])].join(', ');
                        provider.modelStatus = `已获取 ${data.models.length} 个模型`;
                    } catch (error) {
                        provider.modelStatus = error.message || '获取模型失败';
                    } finally {
                        provider.loadingModels = false;
                    }
                };

                const loadSettings = async () => {
                    if (!token || role !== 'admin') return logout();
                    const res = await fetch('/api/admin/settings', {
                        headers: { Authorization: 'Bearer ' + token }
                    });
                    if (!res.ok) return logout();
                    const loaded = await res.json();
                    let providers = [];
                    try { providers = JSON.parse(loaded.external_providers || '[]'); } catch (error) {}
                    if (!providers.length && (loaded.external_api_url || loaded.external_api_key)) {
                        providers.push({
                            id: 'legacy-google', name: 'Google AI', type: 'openai',
                            base_url: loaded.external_api_url || 'https://generativelanguage.googleapis.com/v1beta/openai',
                            api_key: loaded.external_api_key || '',
                            models: loaded.external_models || 'gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3-flash-preview'
                        });
                    }
                    settings.value = { ...loaded, proxy_url: loaded.proxy_url || '', providers: providers.map(provider => createProvider(provider)) };
                    loading.value = false;
                };

                const saveSettings = async () => {
                    saving.value = true;
                    const res = await fetch('/api/admin/settings', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            Authorization: 'Bearer ' + token
                        },
                        body: JSON.stringify(settings.value)
                    });
                    saving.value = false;
                    if (res.ok) alert('保存成功，新的对话上下文已生效。');
                    else alert('保存失败，请重新登录。');
                };

                onMounted(loadSettings);
                return { settings, optionFields, loading, saving, saveSettings, logout, goHome, addProvider, removeProvider, fetchModels };
            }
        }).mount('#app');
    </script>
</body>
</html>
